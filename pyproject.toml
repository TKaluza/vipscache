[project]
name = "vipscache"
version = "0.4.2"
description = "Content-addressed derivative cache for images and pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Kaluza", email = "tim@kaluza.space" }]
requires-python = ">=3.12"
keywords = ["image", "cache", "libvips", "pdf", "thumbnails", "zeromq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "xxhash>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/TKaluza/vipscache"
Repository = "https://github.com/TKaluza/vipscache"
Issues = "https://github.com/TKaluza/vipscache/issues"
Changelog = "https://github.com/TKaluza/vipscache/blob/main/CHANGELOG.md"

[project.optional-dependencies]
client = [
    "pyzmq>=26.0.0",
]
worker = [
    "lmdb>=1.5.1",
    "pydantic-settings>=2.0.0",
    "pyvips>=3.0.0",
    "pyzmq>=26.0.0",
]

[dependency-groups]
dev = [
    "lmdb>=1.5.1",
    "pydantic-settings>=2.0.0",
    "pyvips>=3.0.0",
    "pyzmq>=26.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
vipscache-zmq-healthcheck = "vipscache.zmq_client:main"
vipscache-zmq-worker = "vipscache.zmq_worker:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
