name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py="$(uv version --short)"
          node="$(node -p "require('./clients/node/package.json').version")"
          echo "tag=$tag python=$py node=$node"
          test "$tag" = "$py" && test "$tag" = "$node"
      - run: uv build
      - name: Pack Node client
        working-directory: clients/node
        run: mkdir -p ../../node-dist && npm ci && npm pack --pack-destination ../../node-dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: node-dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vipscache
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Create release with packages attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
