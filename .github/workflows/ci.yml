name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - name: Build Node client for cross-language test
        working-directory: clients/node
        run: npm ci && npm run build
      - run: uv sync --frozen
      - run: uv run pytest -ra
      - name: Build Python package
        run: uv build
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  node:
    name: Node client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: clients/node/*.tgz

  containers:
    name: Worker + Node containers
    runs-on: ubuntu-latest
    needs: [python, node]
    steps:
      - uses: actions/checkout@v5
      - name: Cross-container Node client test
        run: scripts/test_node_container.sh
        env:
          CONTAINER_ENGINE: docker
