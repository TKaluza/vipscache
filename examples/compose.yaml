services:
  worker:
    build:
      context: ..
      dockerfile: Containerfile.worker
    image: vipscache-worker:local
    environment:
      VIPSCACHE_ENDPOINT: tcp://*:5555
      VIPSCACHE_LIBVIPS_CACHE_MAX_FILES: "100"
      VIPSCACHE_LIBVIPS_CACHE_MAX_MEM_MB: "128"
      VIPSCACHE_LIBVIPS_CACHE_MAX_OPS: "0"
      VIPSCACHE_LIBVIPS_CONCURRENCY: "1"
      VIPSCACHE_MAX_WORKERS: "4"
      VIPSCACHE_ROOT: /data
      VIPSCACHE_STATE_DIR: /state/stats
      VIPSCACHE_MANAGEMENT_DIR: /state/retention
      VIPSCACHE_MANAGEMENT_SESSION_TIMEOUT_SECONDS: "300"
      VIPSCACHE_GC_INTERVAL_SECONDS: "60"
      VIPSCACHE_MAX_INPUT_PIXELS: "100000000"
      VIPSCACHE_MAX_OUTPUT_PIXELS: "100000000"
      VIPSCACHE_MAX_DPI: "600"
      # Optional soft budget for unpinned nodes and leaves, in bytes:
      # VIPSCACHE_MAX_CACHE_BYTES: "53687091200"
      VIPSCACHE_TTL_SECONDS: "604800"
    volumes:
      - vipscache-data:/data
      # LOCAL persistent volume: SQLite pins must survive recreation of the
      # container. Only /state/stats is disposable. Never put /state on a NAS.
      - vipscache-worker-state:/state
    expose:
      - "5555"
    healthcheck:
      test: ["CMD", "vipscache-zmq-healthcheck", "--endpoint", "tcp://127.0.0.1:5555"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vipscache-data:
  vipscache-worker-state:
