services:
  worker:
    build:
      context: ..
      dockerfile: Containerfile.worker
    image: vipscache-worker:local
    environment:
      VIPSCACHE_ENDPOINT: tcp://*:5555
      VIPSCACHE_LIBVIPS_CACHE_MAX_FILES: "100"
      VIPSCACHE_LIBVIPS_CACHE_MAX_MEM_MB: "128"
      VIPSCACHE_LIBVIPS_CACHE_MAX_OPS: "0"
      VIPSCACHE_LIBVIPS_CONCURRENCY: "1"
      VIPSCACHE_MAX_WORKERS: "4"
      VIPSCACHE_ROOT: /data
      VIPSCACHE_STATE_DIR: /state
      VIPSCACHE_TTL_SECONDS: "604800"
    volumes:
      - vipscache-data:/data
      # Worker-local LMDB mmap state. Do not mount this on the shared vipscache
      # root or on a network filesystem.
      - vipscache-worker-state:/state
    expose:
      - "5555"
    healthcheck:
      test: ["CMD", "vipscache-zmq-healthcheck", "--endpoint", "tcp://127.0.0.1:5555"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vipscache-data:
  vipscache-worker-state:
